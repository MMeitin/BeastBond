name: Bug report
description: Something broke or doesn't look right
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: And what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Lua error
      description: Text from the red error box (BugSack, or `/console scriptErrors 1`). Leave empty if there was none.
      render: text
  - type: textarea
    id: debug
    attributes:
      label: "`/bb debug` output"
      description: Type `/bb debug` with your pet out and paste the lines here.
      render: text
  - type: input
    id: version
    attributes:
      label: BeastBond version
      description: Shown by `/bb about`
