name: Test report / feedback
description: Tell me what you tried, even if everything worked
labels: [feedback]
body:
  - type: markdown
    attributes:
      value: Thanks for testing! See [docs/TESTING.md](../blob/main/docs/TESTING.md) for the checklist.
  - type: checkboxes
    id: tried
    attributes:
      label: What did you try?
      options:
        - label: Happiness / hungry alerts
        - label: Feed button
        - label: Missing or dead pet warning
        - label: Rare tame alert
        - label: Journal
  - type: dropdown
    id: result
    attributes:
      label: Overall result
      options:
        - Everything worked
        - Mostly worked, small issues
        - Something did not work
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes, ideas or things that felt off
  - type: textarea
    id: debug
    attributes:
      label: "`/bb debug` output (pet out)"
      render: text
